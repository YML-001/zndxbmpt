<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台登录 - 中南大学保密学习平台</title>
<style>
/* 设计令牌：取自 Figma 管理端 */
:root {
  --p: #006DAD; --p2: #2A8DC7; --pl: #E3F1F9; --pll: #F3F9FD;
  --t1: #1E323F; --t2: #627079; --t3: #979FA6;
  --line: #E3F1F9; --bd: #D8DBE4; --red: #F43F51; --green: #0E9F63; --orange: #E8801A; --bg: #EDF5FA;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
body { font-family: "OPPOSans", -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: var(--t1); background: var(--bg); min-width: 1280px; line-height: 1.5; }
/* 顶栏 */
.top { height: 56px; display: flex; align-items: center; padding: 0 20px; color: #fff; position: sticky; top: 0; z-index: 20;
  background: linear-gradient(90deg, #1A7DBE 0%, #2A8DC7 45%, #2A8DC7 100%); box-shadow: 0 2px 8px rgba(0, 80, 130, .15); }
.brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brand img { width: 36px; height: 36px; }
.brand b { display: block; font-size: 15px; letter-spacing: .5px; line-height: 1.2; white-space: nowrap; }
.brand small { display: block; font-size: 7px; opacity: .85; letter-spacing: .3px; }
.fold { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; margin-left: 16px; cursor: pointer; background: rgba(255,255,255,.12); }
.fold:hover { background: rgba(255,255,255,.22); }
.topright { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 13px; }
.role-pill { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); border-radius: 14px; padding: 3px 12px; }
.bell { position: relative; display: flex; }
.bell em { position: absolute; top: -5px; right: -7px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red); font: 600 10px/15px sans-serif; font-style: normal; text-align: center; }
.avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.8); }
/* 布局 */
.layout { display: flex; min-height: calc(100vh - 56px); }
.side { width: 232px; flex-shrink: 0; padding: 12px 12px 24px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
  background: linear-gradient(180deg, #CFEAFA 0%, #EEF8FE 38%, #FFFFFF 100%); }
.side .sch { height: 32px; border-radius: 6px; background: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: var(--t3); font-size: 12px; margin-bottom: 14px; }
.grp { margin-bottom: 6px; }
.grp-h { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 20px; color: var(--t1); font-weight: 600; cursor: pointer; user-select: none; transition: background .15s; }
.grp-h:hover { background: rgba(255,255,255,.7); }
.grp-h svg:first-child { color: var(--p); }
.grp-h .chev { margin-left: auto; color: var(--t3); transition: transform .2s; transform: rotate(-90deg); }
.grp.open .grp-h .chev { transform: none; }
.grp.cur .grp-h { background: linear-gradient(90deg, #2A8DC7, #006DAD); color: #fff; box-shadow: 0 4px 12px rgba(0, 109, 173, .25); }
.grp.cur .grp-h svg, .grp.cur .grp-h .chev { color: #fff; }
.grp.one .grp-h .nb { margin-left: auto; }
.grp ul { list-style: none; padding: 4px 0 4px 16px; position: relative; display: none; }
.grp.open ul { display: block; }
.grp ul::before { content: ""; position: absolute; left: 20px; top: 18px; bottom: 20px; width: 1px; background: #D3DEE5; }
.grp li a { display: flex; align-items: center; gap: 12px; height: 34px; font-size: 13px; color: var(--t2); position: relative; }
.grp li a::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #B8C4CC; background: #fff; flex-shrink: 0; position: relative; z-index: 1; }
.grp li a:hover { color: var(--p); }
.grp li a.on { color: var(--p); font-weight: 700; }
.grp li a.on::before { border: 3px solid var(--p); }
.nb { margin-left: auto; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--red); color: #fff; font: 600 11px/18px sans-serif; font-style: normal; text-align: center; }
.grp li a .nb { margin-right: 8px; } .grp-h .nb + .chev { margin-left: 6px; } .grp.open .grp-h .nb { display: none; } .grp.open .grp-h .chev { margin-left: auto; }
body.side-off .side { display: none; }
body.side-off .main { padding-left: 16px; }
.main { flex: 1; min-width: 0; padding: 0 16px 0 10px; display: flex; flex-direction: column; }
.tabsbar { height: 42px; display: flex; align-items: flex-end; gap: 4px; }
.tabsbar a { height: 30px; padding: 0 14px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--t2); border-radius: 6px 6px 0 0; }
.tabsbar a.on { background: var(--pl); color: var(--p); font-weight: 600; }
.scope { margin-left: auto; align-self: center; font-size: 12px; color: var(--t2); display: flex; align-items: center; gap: 6px; }
.scope b { color: var(--p); }
/* 面板 */
.panel { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 1px 5px rgba(45, 47, 51, .06); }
.pbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 12px; }
.h .hacts { display: flex; align-items: center; gap: 8px; }
.subtabs { display: flex; gap: 36px; border-bottom: 1px solid var(--line); margin: -4px 0 12px; }
.subtabs a { padding: 8px 0 10px; color: var(--t2); position: relative; }
.subtabs a.on { color: var(--p); font-weight: 600; }
.subtabs a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--p); }
.subtabs em { font-style: normal; margin-left: 4px; font-size: 12px; background: #FFECEE; color: var(--red); border-radius: 8px; padding: 0 6px; }
.h { font-size: 16px; font-weight: 700; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
.h small { font-size: 13px; font-weight: 400; color: var(--p); display: flex; align-items: center; gap: 4px; }
/* 筛选 */
.flt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 7px 0; border-bottom: 1px dashed #EAF0F4; font-size: 13px; }
.flt > b { width: 84px; color: var(--t2); font-weight: 400; flex-shrink: 0; }
.flt span { padding: 3px 11px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.flt span.on { background: var(--pl); color: var(--p); }
.flt .more { margin-left: auto; background: #F2F6F9; color: var(--t2); }
.chosen { display: flex; align-items: center; gap: 8px; padding: 10px 0 0; font-size: 13px; }
.chosen .c { background: var(--pll); border: 1px solid var(--line); color: var(--p); border-radius: 4px; padding: 2px 8px; display: flex; align-items: center; gap: 4px; }
.tools { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.tools .sp { flex: 1; }
.sin { width: 280px; height: 32px; border: 1px solid var(--bd); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: #A8B0B7; font-size: 13px; background: #fff; }
.sel { height: 32px; min-width: 132px; border: 1px solid var(--bd); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; color: var(--t1); font-size: 13px; background: #fff; }
.sel.ph { color: #A8B0B7; }
/* 按钮 */
.b { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line); background: #fff; color: var(--p); font-size: 13px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; font-family: inherit; }
.b:hover { border-color: #9CC8E3; }
.b.pri { background: linear-gradient(90deg, #2A8DC7, #006DAD); border: none; color: #fff; box-shadow: 0 3px 8px rgba(0,109,173,.2); }
.b.danger { color: var(--red); border-color: #FFD5DA; }
.b.lg { height: 38px; padding: 0 22px; font-size: 14px; }
.b.icon { width: 32px; padding: 0; justify-content: center; }
.b.icon.on { background: var(--p); color: #fff; border-color: var(--p); }
/* 表格 */
.tb { width: 100%; border-collapse: collapse; }
.tb th { background: var(--pl); font-weight: 500; text-align: left; height: 44px; padding: 0 10px; white-space: nowrap; }
.tbw { overflow-x: auto; }
.tb td { height: 50px; padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--t2); white-space: nowrap; }
.tb tr:hover td { background: #F7FBFE; }
.tb .r { text-align: right; font-variant-numeric: tabular-nums; }
.tb .c { text-align: center; }
.tb .strong { color: var(--t1); }
.tb a.op { color: var(--p); margin-right: 12px; }
.tb a.op.del { color: var(--red); }
.tb .person { display: inline-flex; align-items: center; gap: 8px; color: var(--t1); }
.tb .person img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.tb .pic { width: 44px; height: 32px; border-radius: 4px; object-fit: cover; vertical-align: middle; margin-right: 4px; }
.ck { width: 14px; height: 14px; border: 1px solid #C0C4CC; border-radius: 2px; display: inline-block; vertical-align: middle; position: relative; background: #fff; }
.ck.on { background: var(--p); border-color: var(--p); }
.ck.on::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.pager { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 13px; color: var(--t2); }
.pager b { color: var(--p); }
.pages { display: flex; gap: 6px; }
.pages span { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 4px; background: #F2F5F8; display: grid; place-items: center; }
.pages span.on { background: linear-gradient(180deg, #4A92DB, #1B7DBF); color: #fff; }
.pages span.sel { display: flex; background: #fff; height: 30px; }
/* 状态标签 */
.st { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.blue { background: var(--pl); color: var(--p); } .st.green { background: #E6F6EE; color: var(--green); }
.st.orange { background: #FFF2E3; color: var(--orange); } .st.red { background: #FFECEE; color: var(--red); } .st.gray { background: #F1F3F5; color: #8A949B; }
.tg { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 12px; background: var(--pl); color: var(--p); white-space: nowrap; }
.tg.red { background: #FFECEE; color: var(--red); } .tg.orange { background: #FFF2E3; color: var(--orange); } .tg.gray { background: #F1F3F5; color: var(--t2); } .tg.green { background: #E6F6EE; color: var(--green); }
/* 统计卡 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.stat { background: #fff; border-radius: 12px; padding: 16px 18px; position: relative; overflow: hidden; box-shadow: 0 1px 5px rgba(45,47,51,.06); }
.stat::after { content: ""; position: absolute; right: -30px; bottom: -40px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(42,141,199,.1), transparent 70%); }
.stat .k { color: var(--t2); font-size: 13px; }
.stat .v { font-size: 28px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; font-weight: 400; color: var(--t2); margin-left: 4px; }
.stat .d { font-size: 12px; margin-top: 2px; color: var(--green); }
.stat .d.down { color: var(--red); }
.stat .ic { position: absolute; right: 16px; top: 16px; width: 42px; height: 42px; border-radius: 12px; background: var(--pl); color: var(--p); display: grid; place-items: center; }
/* 详情 */
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 36px; }
.kv.c3 { grid-template-columns: repeat(3, 1fr); } .kv.c2 { grid-template-columns: repeat(2, 1fr); }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.kv span { color: var(--t2); white-space: nowrap; } .kv b { font-weight: 400; text-align: right; }
.photo-row { display: flex; gap: 12px; flex-wrap: wrap; }
.photo-row img { width: 150px; height: 96px; border-radius: 6px; object-fit: cover; }
/* 表单 */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 48px; }
.fi { display: flex; align-items: flex-start; gap: 12px; }
.fi.full { grid-column: 1 / -1; }
.fi > label { width: 120px; flex-shrink: 0; text-align: right; line-height: 32px; }
.fi > label.req::before { content: "* "; color: var(--red); }
.fi .ctl { flex: 1; min-width: 0; }
.in { height: 32px; border: 1px solid var(--bd); border-radius: 4px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; }
.in.ph { color: #A8B0B7; }
.in.ta { height: 92px; align-items: flex-start; padding-top: 6px; }
.in > .iv { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .in.ta > .iv { white-space: normal; }
.in > svg { flex-shrink: 0; }
.hint { font-size: 12px; color: var(--t3); margin-top: 4px; }
.rd { display: inline-flex; align-items: center; gap: 6px; margin-right: 20px; line-height: 32px; }
.rd i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #C0C4CC; }
.rd.on i { border: 4px solid var(--p); }
.cb { display: inline-flex; align-items: center; gap: 6px; margin-right: 18px; line-height: 32px; }
.sw { width: 38px; height: 20px; border-radius: 10px; background: #D8DBE4; position: relative; display: inline-block; vertical-align: middle; flex-shrink: 0; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw.on { background: var(--p); } .sw.on::after { left: 20px; }
.upload { border: 1px dashed #9CC8E3; border-radius: 8px; background: var(--pll); padding: 26px; text-align: center; color: var(--t2); }
.upload .ui { width: 48px; height: 48px; margin: 0 auto 8px; border-radius: 12px; background: #fff; color: var(--p); display: grid; place-items: center; }
.form-foot { display: flex; justify-content: center; gap: 12px; padding: 18px 0 4px; border-top: 1px solid var(--line); margin-top: 20px; }
.warn { background: #FFF1F2; border: 1px solid #FFD0D5; color: #D92B3A; border-radius: 6px; padding: 10px 14px; display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
.tip { background: #EEF7FC; border: 1px solid #CFE6F4; color: #155F8F; border-radius: 6px; padding: 10px 14px; display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
/* 步骤、时间线 */
.steps { display: flex; align-items: center; margin: 4px 0 22px; }
.step { display: flex; align-items: center; gap: 8px; color: var(--t3); flex-shrink: 0; }
.step i { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #C8D2D9; display: grid; place-items: center; font-style: normal; font-size: 13px; }
.step.on { color: var(--p); font-weight: 600; } .step.on i { background: var(--p); border-color: var(--p); color: #fff; }
.step.done { color: var(--t1); } .step.done i { border-color: var(--p); color: var(--p); }
.steps .ln { flex: 1; height: 1px; background: #D8E3EA; margin: 0 14px; min-width: 40px; }
.tl { list-style: none; position: relative; padding-left: 22px; }
.tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: #D8E3EA; }
.tl li { position: relative; padding-bottom: 16px; }
.tl li::before { content: ""; position: absolute; left: -21px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 2px solid #B8C4CC; }
.tl li.done::before { border-color: var(--green); background: var(--green); }
.tl li.cur::before { border-color: var(--p); box-shadow: 0 0 0 4px rgba(0,109,173,.15); }
.tl li.rej::before { border-color: var(--red); background: var(--red); }
.tl .t { font-weight: 600; } .tl .m { font-size: 12px; color: var(--t3); }
.tl .c { margin-top: 4px; background: var(--pll); border-radius: 6px; padding: 6px 10px; color: var(--t2); font-size: 13px; }
/* 栅格与工具 */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.g21 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; } .g12 { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
.g2 > .panel, .g3 > .panel, .g21 > .panel, .g12 > .panel { margin-bottom: 0; }
.mb { margin-bottom: 12px; } .muted { color: var(--t2); } .small { font-size: 12px; } .blue { color: var(--p); } .red { color: var(--red); } .green { color: var(--green); } .orange { color: var(--orange); }
.flex { display: flex; align-items: center; gap: 8px; } .between { display: flex; align-items: center; justify-content: space-between; }
.chart { height: 280px; }
.bar { height: 8px; border-radius: 4px; background: #EAF2F8; overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4A92DB, #006DAD); }
.foot { text-align: center; color: var(--t3); font-size: 12px; padding: 16px 0 20px; margin-top: auto; }
/* 演示浮标 */
/* 弹窗 */
.modal-mask { position: fixed; inset: 0; z-index: 60; background: rgba(12, 32, 52, .45); display: none; align-items: flex-start; justify-content: center; padding: 6vh 20px; overflow-y: auto; }
.modal-mask.show { display: flex; }
.modal { width: 760px; max-width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 40, 70, .25); display: flex; flex-direction: column; max-height: 88vh; animation: pop .18s ease-out; }
.modal.sm { width: 520px; } .modal.lg { width: 1000px; }
.modal-mask.drawer { justify-content: flex-end; align-items: stretch; padding: 0; overflow: hidden; }
.modal-mask.drawer .modal { width: 900px; height: 100vh; max-height: 100vh; border-radius: 0; animation: slide .2s ease-out; }
.modal-mask.drawer .modal-h { border-radius: 0; } .modal-mask.drawer .modal-b { flex: 1; background: #F7FAFC; }
@keyframes slide { from { transform: translateX(48px); opacity: 0; } to { transform: none; opacity: 1; } }
.sec { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; }
.sec > .h { margin-bottom: 10px; }
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-h { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 20px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 700; border-radius: 12px 12px 0 0; background: linear-gradient(90deg, #EAF5FC, #fff 60%); }
.modal-h .mi { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #2A8DC7, #006DAD); color: #fff; display: grid; place-items: center; }
.modal-h .x { margin-left: auto; color: var(--t3); cursor: pointer; display: flex; padding: 4px; border-radius: 6px; }
.modal-h .x:hover { background: var(--pl); color: var(--p); }
.modal-b { padding: 20px 24px; overflow-y: auto; }
.modal-f { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); }
.modal-f .tip-l { margin-right: auto; color: var(--t3); font-size: 12px; }
.modal .form { gap: 16px 28px; } .modal .fi > label { width: 100px; }
.modal .form.one { grid-template-columns: 1fr; }
.modal .h:first-child { margin-top: 0; }
.cf { display: flex; gap: 14px; align-items: flex-start; padding: 4px 0; }
.cf .cf-i { width: 40px; height: 40px; border-radius: 50%; background: #FFF2E3; color: var(--orange); display: grid; place-items: center; flex-shrink: 0; }
.cf p { line-height: 1.8; color: var(--t1); padding-top: 8px; }
.b.pri.dg { background: linear-gradient(90deg, #FF6B7A, #F43F51); box-shadow: 0 3px 8px rgba(244,63,81,.25); }
/* 轻提示 */
.toast { position: fixed; top: 70px; left: 50%; z-index: 90; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; transition: .22s;
  display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #CDEBDC; border-radius: 8px; padding: 10px 18px; box-shadow: 0 10px 30px rgba(0,40,70,.16); color: var(--t1); }
.toast svg { color: var(--green); flex-shrink: 0; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.ntc a { display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.ntc a:last-child { border-bottom: none; } .ntc a:hover b { color: var(--p); }
